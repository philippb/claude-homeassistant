cradlewise_start_recipe:
  alias: Cradlewise Start Recipe
  description: Turns on rocking and music for a set duration, then turns them off.
  fields:
    duration_minutes:
      description: How long to run the recipe (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
  sequence:
    - service: switch.turn_on
      target:
        entity_id: switch.cradlewise_avo_rocking
    - service: switch.turn_on
      target:
        entity_id: switch.cradlewise_avo_music
    - delay: "00:{{ '%02d' | format(duration_minutes | int) }}:00"
    - service: switch.turn_off
      target:
        entity_id: switch.cradlewise_avo_rocking
    - service: switch.turn_off
      target:
        entity_id: switch.cradlewise_avo_music
  mode: single
  icon: mdi:baby-carriage
