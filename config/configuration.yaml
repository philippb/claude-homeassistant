              {% else %}
                {% set now_ts = as_timestamp(now()) %}
                {% set end_ts = as_timestamp(now() + timedelta(hours=24)) %}
                {% set future = namespace(items=[]) %}
                {% for it in data %}
                  {% set ts = as_timestamp(it.DateTime) %}
                  {% if ts is not none and ts >= now_ts and ts < end_ts %}
