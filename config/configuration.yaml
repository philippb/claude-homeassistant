      - name: "Boiler 15m plan"
        unique_id: boiler_plan_15m
        icon: mdi:calendar-clock
        state: >-
          {% set data = state_attr('sensor.shf_price_15m','data') %}
          {% if not data %}
            no-data
          {% else %}
            {% set e24 = states('sensor.boiler_heat_delivered_24h_kwh') | float(0) %}
            {% set e48 = states('sensor.boiler_heat_delivered_48h_kwh') | float(0) %}
            {% set min24 = states('input_number.boiler_min_energy_24h') | float(0) %}
            {% set buf24 = states('input_number.boiler_buffer_energy_24h') | float(0) %}
            {% set max48 = states('input_number.boiler_max_energy_48h') | float(0) %}
            {% set need_kwh = (min24 + buf24) - e24 %}
            {% set cap_kwh  = max48 - e48 %}

            {% if need_kwh <= 0 or cap_kwh <= 0 %}
              q=0 (locked)
            {% else %}
              {% set need_q = ((need_kwh / 0.25) | round(0, 'ceil')) | int %}
              {% set cap_q  = ((cap_kwh  / 0.25) | round(0, 'floor')) | int %}
              {% set q = [need_q, cap_q] | min %}
