                  {% if ts is not none and ts >= now_ts and ts < end_ts %}
                    {% set future.items = future.items + [ {
                      'start': as_datetime(it.DateTime).strftime('%Y-%m-%d %H:%M'),
                      'price_with_tax': (it.PriceWithTax | float(999)),
                      'rank': (it.Rank | int(999))
                    } ] %}
                  {% endif %}
                {% endfor %}
                {{ (future.items | sort(attribute='price_with_tax'))[:q] }}
              {% endif %}
            {% endif %}

  - binary_sensor:
      - name: "Boiler should be on (15m)"
        unique_id: boiler_should_be_on_15m
        state: >
          {% set series = state_attr('sensor.shf_price_15m', 'data') %}
          {% if series is not iterable or series|length == 0 %}
            false
          {% else %}
            {% set e24 = states('sensor.boiler_heat_delivered_24h_kwh')|float(0) %}
            {% set e48 = states('sensor.boiler_heat_delivered_48h_kwh')|float(0) %}
            {% set hard = states('input_number.boiler_min_energy_24h')|float(2.0) %}
            {% set buf  = states('input_number.boiler_buffer_energy_24h')|float(0.5) %}
            {% set max48 = states('input_number.boiler_max_energy_48h')|float(8.0) %}
            {% set target24 = hard + buf %}
            {% set need_kwh = target24 - e24 %}
            {% set cap_kwh = max48 - e48 %}
            {% if need_kwh <= 0 or cap_kwh <= 0 %}
              false
            {% else %}
              {% set need_q = (need_kwh / 0.25) | round(0,'ceil') | int %}
              {% set cap_q  = (cap_kwh  / 0.25) | round(0,'floor') | int %}
              {% set q = [need_q, cap_q] | min %}
              {% if q <= 0 %}
                false
              {% else %}
                {% set now_ts = now() | as_timestamp %}
                {% set end_ts = (now() + timedelta(hours=24)) | as_timestamp %}
                {% set fut = namespace(v=[]) %}
                {% for item in series %}
                  {% set ts = as_timestamp(item.DateTime) %}
                  {% if ts >= now_ts and ts < end_ts %}
                    {% set fut.v = fut.v + [item] %}
                  {% endif %}
                {% endfor %}
                {% if fut.v|length == 0 %}
                  false
                {% else %}
                  {% set N = fut.v|length %}
                  {% set q2 = [q, N] | min %}
                  {% set pairs = namespace(v=[]) %}
                  {% for i in range(N) %}
                    {% set p = fut.v[i].PriceWithTax | float(999) %}
                    {% set pairs.v = pairs.v + [(i, p)] %}
                  {% endfor %}
                  {% set chosen = (pairs.v | sort(attribute=1))[:q2] | map(attribute=0) | list %}
                  {{ 0 in chosen }}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}


  - binary_sensor:
      - name: "Boiler heating active (1kW)"
        unique_id: boiler_heating_active_1kw
        device_class: power
        state: >-
          {{ is_state('switch.ilp_switch_0','on')
             and (states('sensor.ilp_switch_0_power')|float(0)) >= 900 }}

      - name: "Boiler saturated (no load)"
        unique_id: boiler_saturated_no_load
        state: >-
          {{ is_state('switch.ilp_switch_0','on')
             and (states('sensor.ilp_switch_0_power')|float(0)) <= 50 }}


  - sensor:

    - name: "Bath air saturation vapor pressure"
      unique_id: bath_air_sat_vapor_pressure
      unit_of_measurement: "hPa"
      state: >
        {% set T_s = states('sensor.vallox_extract_air') %}
        {% if T_s in ['unknown','unavailable'] %}
          unknown
        {% else %}
          {% set T = T_s | float %}
          {% set es = 6.112 * (2.718281828 ** ((17.62*T)/(243.12+T))) %}
          {{ es | round(2) }}
        {% endif %}

    - name: "Bath air VPD"
      unique_id: bath_air_vpd
      unit_of_measurement: "hPa"
      state: >
        {% set es_air = states('sensor.bath_air_sat_vapor_pressure') %}
        {% set ea = states('sensor.bath_vapor_pressure') %}
        {% if es_air in ['unknown','unavailable'] or ea in ['unknown','unavailable'] %}
          unknown
        {% else %}
          {{ (es_air|float - ea|float) | round(2) }}
        {% endif %}

  - binary_sensor:
      - name: Bath moisture suspect
        unique_id: bath_moisture_suspect
        delay_on: "00:00:20"
        delay_off: "00:01:00"
        state: >
          {% set rh5  = states('sensor.vallox_rh_change_5min') | float(0) %}
          {{ (rh5 >= 10) }}



  - binary_sensor:
      - name: Bath moisture event
        unique_id: bath_moisture_event
        delay_on: "00:00:40"
        delay_off: "00:03:00"
        state: >
          {% set rh5  = states('sensor.vallox_rh_change_5min') | float(0) %}
          {% set rh1  = states('sensor.vallox_rh_change_1min') | float(0) %}
          {% set fan1 = states('sensor.vallox_fan_change_1min') | float(0) %}

          {% set RH5_TH = 10 %}
          {% set RH1_TH = 2 %}
          {% set FAN1_TH = 2 %}

          {% set rh_event = (rh5 >= RH5_TH) and (rh1 >= RH1_TH or fan1 >= FAN1_TH) %}

          {{ rh_event }}





  - sensor:
      - name: "Vallox humidity filtered"
        unique_id: vallox_humidity_filtered
        unit_of_measurement: "%"
        state: >
          {{ states('sensor.vallox_humidity') | float(0) }}

  - sensor:
      - name: "Bath dew point"
        unique_id: bath_dew_point
        unit_of_measurement: "°C"
        state: >
          {% set T_s = states('sensor.vallox_extract_air') %}
          {% set RH_s = states('sensor.vallox_humidity') %}
          {% if T_s in ['unknown','unavailable','none',''] or RH_s in ['unknown','unavailable','none',''] %}
            unknown
          {% else %}
            {% set T = T_s | float(none) %}
            {% set RH_raw = RH_s | float(none) %}
            {% if T is none or RH_raw is none %}
              unknown
            {% else %}
              {# estä log(0) / log(negatiivinen) #}
              {% set RH = [RH_raw, 0.1] | max %}
              {% set a = 17.62 %}
              {% set b = 243.12 %}
              {% set gamma = (a * T / (b + T)) + log(RH / 100) %}
              {{ ((b * gamma) / (a - gamma)) | round(2) }}
            {% endif %}
          {% endif %}


      - name: "Bath vapor pressure"
        unique_id: bath_vapor_pressure
        unit_of_measurement: "hPa"
        state: >
          {% set T_s = states('sensor.vallox_extract_air') %}
          {% set RH_s = states('sensor.vallox_humidity') %}
          {% if T_s in ['unknown','unavailable'] or RH_s in ['unknown','unavailable'] %}
            unknown
          {% else %}
            {% set T = T_s | float %}
            {% set RH = RH_s | float %}
            {% set es = 6.112 * (2.718281828 ** ((17.62*T)/(243.12+T))) %}
            {{ (es * RH / 100) | round(2) }}
          {% endif %}

      - name: "Floor sat vapor pressure"
        unique_id: floor_sat_vapor_pressure
        unit_of_measurement: "hPa"
        state: >
          {% set Tf_s = states('sensor.tallin_kylpyhuone_external_sensor') %}
          {% if Tf_s in ['unknown','unavailable'] %}
            unknown
          {% else %}
            {% set Tf = Tf_s | float %}
            {% set es = 6.112 * (2.718281828 ** ((17.62*Tf)/(243.12+Tf))) %}
            {{ es | round(2) }}
          {% endif %}

      - name: "Floor VPD gain +3C"
        unique_id: floor_vpd_gain_3c
        unit_of_measurement: "hPa"
        state: >
          {% set Tf_s = states('sensor.tallin_kylpyhuone_external_sensor') %}
          {% if Tf_s in ['unknown','unavailable'] %}
            unknown
          {% else %}
            {% set Tf = Tf_s | float %}
            {% set T2 = Tf + 3 %}
            {% set es1 = 6.112 * (2.718281828 ** ((17.62*Tf)/(243.12+Tf))) %}
            {% set es2 = 6.112 * (2.718281828 ** ((17.62*T2)/(243.12+T2))) %}
            {{ (es2 - es1) | round(2) }}
          {% endif %}

      - name: "Floor VPD now"
        unique_id: floor_vpd_now
        unit_of_measurement: "hPa"
        state: >
          {% set es_floor = states('sensor.floor_sat_vapor_pressure') %}
          {% set ea = states('sensor.bath_vapor_pressure') %}
          {% if es_floor in ['unknown','unavailable'] or ea in ['unknown','unavailable'] %}
            unknown
          {% else %}
            {{ (es_floor|float - ea|float) | round(2) }}
          {% endif %}


  - binary_sensor:
      - name: "Floor boost worth it"
        unique_id: floor_boost_worth_it
        delay_on: "00:01:30"
        delay_off: "00:08:00"
        state: >
          {% set vpd_s  = states('sensor.bath_air_vpd') %}
          {% set gain_s = states('sensor.floor_vpd_gain_3c') %}
          {% if vpd_s in ['unknown','unavailable','none',''] or gain_s in ['unknown','unavailable','none',''] %}
            false
          {% else %}
            {% set vpd  = vpd_s  | float(0) %}
            {% set gain = gain_s | float(0) %}

            {# boost vain jos ilma ei jo kuivaa tehokkaasti #}
            {% set vpd_low = (vpd <= 4.0) %}

            {# boost tuo merkittävän absoluuttisen lisän #}
            {% set abs_ok = (gain >= 1.5) %}

            {{ vpd_low and abs_ok }}
          {% endif %}




      # Näkyvä tila graafiin: onko boosti käynnissä (skripti asettaa)
      - name: "Floor boost active"
        state: "{{ is_state('input_boolean.shower_floor_boost_active','on') }}"





  - sensor:
      - name: Total Electricity Consumption
        unique_id: total_electricity_consumption_kwh
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >
          {% set ids = [
            'sensor.ajatettu_lampomatto_energy',
            'sensor.autolle_energy',
            'sensor.eteisen_patteri_switch_0_energy',
            'sensor.energiamittari_ikea_energy',
            'sensor.keittion_patteri_switch_0_energy',
            'sensor.kh_et_mh_kulutus_energy',
            'sensor.kuivausrumpu_pakastin_switch_0_energy',
            'sensor.makuuhuone_patteri_switch_0_energy',
            'sensor.pulputit_lammitys_energy',
            'sensor.kanalalampo_energy',
            'sensor.smart_thermostat_2112132467818190863348e1e9815d11_energy',
            'sensor.smart_thermostat_2112134882648690863348e1e9815f30_energy',
            'sensor.smart_thermostat_2112136738677590863348e1e9815dfc_energy',
            'sensor.smart_thermostat_2206241709878160120148e1e999c233_energy',
            'sensor.varaaja_energy',
            'sensor.varaston_valo_energy',
            'sensor.zag063912_energy_meter',
            'sensor.ilptalli_mittari',
            'sensor.jussinhuone_mittari',
            'sensor.annikanhuone_mittari'
          ] %}
          {{ ids
              | map('states')
              | map('float', default=0)
              | sum
              | round(3) }}


  - binary_sensor:
      - name: Boiler should be on (15m)
        unique_id: boiler_should_be_on_15m
        state: >
          {% set series = state_attr('sensor.shf_price_15m', 'data') %}
          {% if series is not iterable or series|length == 0 %}
            false
          {% else %}
            {% set e24 = states('sensor.boiler_heat_delivered_24h_kwh')|float(0) %}
            {% set e48 = states('sensor.boiler_heat_delivered_48h_kwh')|float(0) %}
            {% set hard = states('input_number.boiler_min_energy_24h')|float(2.0) %}
            {% set buf  = states('input_number.boiler_buffer_energy_24h')|float(0.5) %}
            {% set max48 = states('input_number.boiler_max_energy_48h')|float(8.0) %}

            {% set target24 = hard + buf %}
            {% set need_kwh = target24 - e24 %}
            {% set cap_kwh = max48 - e48 %}

            {% if need_kwh <= 0 or cap_kwh <= 0 %}
              false
            {% else %}
              {# 1 kW => 1 vartti = 0.25 kWh #}
              {% set need_q = (need_kwh / 0.25) | round(0,'ceil') | int %}
              {% set cap_q  = (cap_kwh  / 0.25) | round(0,'floor') | int %}
              {% set q = [need_q, cap_q] | min %}
              {% if q <= 0 %}
                false
              {% else %}
                {% set now_ts = now() | as_timestamp %}
                {% set end_ts = (now() + timedelta(hours=24)) | as_timestamp %}
                {% set fut = namespace(v=[]) %}
                {% for item in series %}
                  {% set ts = as_timestamp(item.DateTime) %}
                  {% if ts >= now_ts and ts < end_ts %}
                    {% set fut.v = fut.v + [item] %}
                  {% endif %}
                {% endfor %}
                {% if fut.v|length == 0 %}
                  false
                {% else %}
                  {% set N = fut.v|length %}
                  {% set q2 = [q, N] | min %}
                  {% set pairs = namespace(v=[]) %}
                  {% for i in range(N) %}
                    {% set p = fut.v[i].PriceWithTax | float(999) %}
                    {% set pairs.v = pairs.v + [(i, p)] %}
                  {% endfor %}
                  {% set chosen = (pairs.v | sort(attribute=1))[:q2] | map(attribute=0) | list %}
                  {{ 0 in chosen }}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}

  - sensor:
      - name: "EV price debug (schema)"
        unique_id: ev_price_debug_schema
        icon: mdi:bug-outline
        state: >-
          {% set data = state_attr('sensor.ev_price_slots_15m','data') %}
          {% if data is not iterable or data|length == 0 %}
            no-data
          {% else %}
            {% set it = data[0] %}
            {% set keys = it.keys() | list if it is mapping else [] %}
            keys={{ keys | join(',') }}
          {% endif %}

