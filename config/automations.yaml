- id: ev_charge_control_reconcile_5m
  alias: EV charge control (15m) — reconcile every 5 min
  mode: restart
  enabled: false  # DISABLED: superseded by ev_control_effective_master (has built-in 5m reconcile)
  triggers:
    - trigger: time_pattern
      minutes: "/5"
      seconds: 10

  conditions:
    - condition: state
      entity_id: input_boolean.ev_smart_charge_enabled
      state: "on"

  actions:
    - variables:
        should_now: "{{ is_state('binary_sensor.ev_should_charge_now_15m','on') }}"
        charging_switch: "{{ is_state('switch.zag063912_charging','on') }}"
        charger_mode: "{{ states('sensor.zag063912_charger_mode') }}"
        charging_active: "{{ charging_switch or charger_mode == 'connected_charging' }}"

    - choose:
        # If we should charge but aren't, try resume
        - conditions:
            - condition: template
              value_template: "{{ should_now and not charging_active }}"
          sequence:
            - action: button.press
              target:
                entity_id: button.zag063912_resume_charging

        # If we should NOT charge but are charging, stop
        - conditions:
            - condition: template
              value_template: "{{ (not should_now) and charging_active }}"
          sequence:
            - action: button.press
              target:
                entity_id: button.zag063912_stop_charging