- id: watchdog_cradlewise_crib_stream
  alias: "Watchdog: Recover crib stream if Cradlewise drops"
  description: >
    The crib feed (Cradlewise -> go2rtc -> TV camera wall / Frigate) depends on
    the Cradlewise integration. If the device goes offline or the crib camera
    entity becomes unavailable for 5 minutes, reload the integration to
    reconnect, then re-check and alert if it didn't recover. Re-attempts every
    30 minutes while still down. (The go2rtc/Frigate side is covered by the
    separate Frigate-FPS watchdog.)
  triggers:
    - trigger: state
      entity_id: binary_sensor.cradlewise_avo_online
      to: "off"
      for: "00:05:00"
    - trigger: state
      entity_id: camera.cradlewise_avo_crib_camera
      to: "unavailable"
      for: "00:05:00"
    - trigger: time_pattern
      minutes: "/30"
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.cradlewise_avo_online
          state: "off"
        - condition: state
          entity_id: camera.cradlewise_avo_crib_camera
          state: "unavailable"
  actions:
    - action: homeassistant.reload_config_entry
      target:
        entity_id: camera.cradlewise_avo_crib_camera
    - delay: "00:01:30"
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.cradlewise_avo_online
                  state: "off"
                - condition: state
                  entity_id: camera.cradlewise_avo_crib_camera
                  state: "unavailable"
          sequence:
            - action: notify.mobile_app_kais_iphone
              data:
                title: "⚠️ Crib stream down"
                message: >
                  Cradlewise crib stream is still down after a reload at
                  {{ now().strftime('%H:%M') }}. Check the crib power / Wi-Fi.
            - action: persistent_notification.create
              data:
                notification_id: crib_stream_watchdog
                title: "Crib Stream Watchdog"
                message: >
                  Crib stream unavailable; reloaded Cradlewise at
                  {{ now().strftime('%Y-%m-%d %H:%M') }} but it has not recovered.
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: crib_stream_watchdog
  mode: single
- id: camera_wall_kiosk_watchdog
  alias: Camera Wall Kiosk Watchdog
  description: >
    While Camera Wall kiosk mode is on, keep the camera-wall app in the
    foreground on the hallway CanvasTV. The app's MainActivity is singleTop, so
    relaunching it when it is already foreground is a harmless no-op (onNewIntent,
    no re-render); if the app died (native H.264 decoder crash) this revives it
    within a minute. Gated by input_boolean.camera_wall_kiosk so it never fights
    Art Mode or the doorbell-to-TV casts, which run while kiosk mode is off.
  triggers:
    - trigger: time_pattern
      minutes: /1
    - trigger: state
      entity_id: input_boolean.camera_wall_kiosk
      to: 'on'
  conditions:
    - condition: state
      entity_id: input_boolean.camera_wall_kiosk
      state: 'on'
  actions:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_14_205
      data:
        command: am start -n com.camerawall.tv/.MainActivity
  mode: single
