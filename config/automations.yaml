- id: '1770043343712'
  alias: Lähetä auton tiedot ABRP:lle
  description: ''
  triggers:
  - entity_id: sensor.smart_last_update
    trigger: state
  actions:
  - data:
      token: b1f5d297-35a9-4797-9c3e-cc6fe1b30887
      api_key: f57bde45-fa6f-4ef0-bf1a-d81581a9a0fa
      tlm: "{\"utc\": {{ as_timestamp(states('sensor.smart_last_update')) | int }},\n
        \"soc\": {{ states('sensor.smart_battery') | float }}}\n"
    action: rest_command.abrp
  mode: single
- id: boiler_control_15m_optimized
  alias: Boiler control (15m optimized)
  description: Ohjaa varaajaa valittujen 15 min hintaslottejen perusteella.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /15
    seconds: 0
  - trigger: state
    entity_id: sensor.shf_price_15m
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_force_heat
    state: 'off'
  actions:
  - variables:
      should_on: '{{ is_state(''binary_sensor.boiler_should_be_on_15m'',''on'') }}'
      is_on: '{{ is_state(''switch.ilp_switch_0'',''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_on and not is_on }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.ilp_switch_0
    - conditions:
      - condition: template
        value_template: '{{ (not should_on) and is_on }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ilp_switch_0
- id: boiler_force_heat_on
  alias: Boiler force heat ON
  description: Failsafe 1 - pakota varaaja lämmittämään (huolto tms.)
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.boiler_force_heat
    to: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.ilp_switch_0
    data: {}
- id: boiler_force_heat_off_when_full
  alias: Boiler force heat OFF when full
  description: Failsafe 1 - lopeta pakkolataus kun vastus ei enää kuluta (varaaja
    termostaatilla täynnä)
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ilp_switch_0_power
    below: 10
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_force_heat
    state: 'on'
  - condition: state
    entity_id: switch.ilp_switch_0
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.ilp_switch_0
    data: {}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.boiler_force_heat
    data: {}
- id: boiler_failsafe_no_prices_night_window
  alias: Boiler failsafe 2 - no prices -> heat 01-05
  description: Jos hintadata puuttuu, lämmitä yöllä kunnes minimitäyttö saavutettu.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: 0
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_force_heat
    state: 'off'
  actions:
  - variables:
      e24: '{{ states(''sensor.boiler_heat_delivered_24h_kwh'') | float(0) }}'
      e48: '{{ states(''sensor.boiler_heat_delivered_48h_kwh'') | float(0) }}'
      fill: '{{ states(''input_number.boiler_failsafe_fill_kwh'') | float(4.0) }}'
      max48: '{{ states(''input_number.boiler_max_energy_48h'') | float(8.0) }}'
      cap_ok: '{{ (max48 - e48) > 0 }}'
      has_data: "{{ state_attr('sensor.shf_price_15m','data') is iterable\n   and
        (state_attr('sensor.shf_price_15m','data') | length > 0) }}\n"
      last_u: '{{ as_timestamp(states.sensor.shf_price_15m.last_updated) }}'
      fresh: '{{ (as_timestamp(now()) - last_u) < 86400 }}'
      prices_ok: '{{ has_data and fresh }}'
      in_window: '{{ now().hour >= 1 and now().hour < 5 }}'
      want_heat: '{{ (not prices_ok) and in_window and cap_ok and (e24 < fill) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ want_heat }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.ilp_switch_0
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.ilp_switch_0
- id: '1770934409233'
  alias: Aamulähtö → lattialämmön boost
  triggers:
  - minutes: /1
    trigger: time_pattern
  actions:
  - target:
      entity_id: calendar.jussin_tyot_ja_menot
    data:
      start_date_time: '{{ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat()
        }}'
      end_date_time: '{{ now().replace(hour=12, minute=0, second=0, microsecond=0).isoformat()
        }}'
    response_variable: cal
    action: calendar.get_events
  - variables:
      events: '{{ cal.get(''calendar.jussin_tyot_ja_menot'', {}).get(''events'', [])
        }}'
      re_car: (^|\b)auto\w*(\b|$)
      re_train: (^|\b)juna\w*(\b|$)
      re_helsinki_towards: (^|\b)(helsinki\w*|helsing(?!ist[äa])\w*)(\b|$)
      next_departure: "{% set ns = namespace(t=None, offset=0) %} {% for e in events
        %}\n  {% set s = (e.summary | default('')) | lower %}\n  {% set d = (e.description
        | default('')) | lower %}\n  {% set text = s ~ ' ' ~ d %}\n\n  {% set is_car
        = (text | regex_search(re_car)) is not none %}\n  {% set is_train = (text
        | regex_search(re_train)) is not none %}\n  {% set is_hki = (text | regex_search(re_helsinki_towards))
        is not none %}\n\n  {% if is_car or is_train or is_hki %}\n    {% set start_raw
        = e.start if e.start is defined else e.start_date_time %}\n    {% if start_raw
        %}\n      {% set dt = as_datetime(start_raw) %}\n      {% if ns.t is none
        or dt < ns.t %}\n        {% set ns.t = dt %}\n        {% set ns.offset = 3600
        if is_car else 5400 %}\n      {% endif %}\n    {% endif %}\n  {% endif %}\n{%
        endfor %} {{ {'time': ns.t, 'offset': ns.offset} }}"
      target_time: "{% if next_departure.time %}\n  {{ as_datetime(next_departure.time)
        - timedelta(seconds=next_departure.offset) }}\n{% else %}\n  {{ none }}\n{%
        endif %}"
      ran_today: '{{ this.last_triggered is not none and this.last_triggered.date()
        == now().date() }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  (not ran_today)\n  and target_time is not none\n  and
          now() >= as_datetime(target_time)\n  and now() < (as_datetime(target_time)
          + timedelta(minutes=1))\n}}"
      sequence:
      - data:
          duration: 01:30:00
        action: script.suihku_lattialammon_boost_3_ja_palauta
  mode: single
- id: '1770971544540'
  alias: TESTI – aja lattialämmön boost aina
