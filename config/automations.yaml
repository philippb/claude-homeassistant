- id: 'tesla_starts_moving_alert'
  alias: Tesla Starts Moving Alert
  description: >-
    Any Tesla gear change while user is NOT in the car triggers a notification,
    regardless of where the user or Tesla is located.
    If heading home, also sends an ETA follow-up.
  triggers:
    - trigger: state
      entity_id: sensor.kai_s_tesla_shift_state
      not_to:
        - "unavailable"
        - "unknown"
  conditions:
    - condition: state
      entity_id: binary_sensor.kai_s_tesla_user_present
      state: "off"
  actions:
    - variables:
        gear: "{{ trigger.to_state.state }}"
        dest_state: "{{ states('device_tracker.kai_s_tesla_destination_location_tracker') }}"
        dest_name: >-
          {% if dest_state == 'home' %}
            Home
          {% elif dest_state not in ['not_home', 'unavailable', 'unknown'] %}
            {{ dest_state | title }}
          {% else %}
            {{ state_attr('device_tracker.kai_s_tesla_destination_location_tracker', 'friendly_name')
               or state_attr('device_tracker.kai_s_tesla_destination_location_tracker', 'last_known_name')
               or 'an unknown location' }}
          {% endif %}
        eta_mins: >-
          {% set t = states('sensor.kai_s_tesla_arrival_time') %}
          {% if t not in ['unavailable', 'unknown', 'none', ''] %}
            {{ ((as_timestamp(t) - as_timestamp(now())) / 60) | round(0) | int }}
          {% else %}
            -1
          {% endif %}
        eta_str: >-
          {% set t = states('sensor.kai_s_tesla_arrival_time') %}
          {% if t not in ['unavailable', 'unknown', 'none', ''] %}
            {{ as_timestamp(t) | timestamp_custom('%-I:%M %p') }}
          {% else %}
            unknown
          {% endif %}
    - variables:
        moving_msg: >-
          {% if gear == 'D' %}
          Tesla shifted to Drive.
          {% elif gear == 'R' %}
          Tesla shifted to Reverse.
          {% elif gear == 'P' %}
          Tesla shifted to Park.
          {% elif gear == 'N' %}
          Tesla shifted to Neutral.
          {% else %}
          Tesla gear changed to {{ gear }}.
          {% endif %}
          {% if gear in ['D', 'R'] %}
            {% if dest_state == 'home' %}
          Heading HOME — ETA {{ eta_str }} (~{{ eta_mins }} min).
            {% else %}
          Destination: {{ dest_name }}.
            {% endif %}
          {% endif %}
    - repeat:
        count: 3
        sequence:
          - service: notify.mobile_app_pixel_9_pro_fold
            data:
              title: "Tesla is Moving!"
              message: "{{ moving_msg }}"
              data:
                ttl: 0
                priority: high
                channel: alarm_stream
                tag: tesla_moving
          - delay:
              milliseconds: 800
    - condition: template
      value_template: "{{ gear in ['D', 'R'] and dest_state == 'home' and eta_mins | int > 0 }}"
    - repeat:
        count: 3
        sequence:
          - service: notify.mobile_app_pixel_9_pro_fold
            data:
              title: "Tesla Heading Home"
              message: >-
                Tesla is on the way home!
                Arriving at {{ eta_str }} (~{{ eta_mins }} min,
                {{ states('sensor.kai_s_tesla_distance_to_arrival') | round(1) }} km away).
              data:
                ttl: 0
                priority: high
                channel: alarm_stream
                tag: tesla_heading_home
          - delay:
              milliseconds: 800
  mode: single

- id: 'tesla_approaching_home_countdown'
  alias: Tesla Approaching Home - Countdown Notifications
  description: >-
    Every minute during the last 5 minutes before Tesla arrives home,
    send a countdown alert (stops when < 2 min remain or Tesla arrives).
  triggers:
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: state
      entity_id: binary_sensor.kai_s_tesla_user_present
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: device_tracker.kai_s_tesla_location_tracker
          state: "home"
    - condition: state
      entity_id: device_tracker.kai_s_tesla_destination_location_tracker
      state: "home"
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.kai_s_tesla_arrival_time
          state:
            - "unavailable"
            - "unknown"
    - condition: template
      value_template: >-
        {% set eta_mins = ((as_timestamp(states('sensor.kai_s_tesla_arrival_time')) - as_timestamp(now())) / 60) | int %}
        {{ eta_mins >= 2 and eta_mins <= 5 }}
  actions:
    - variables:
        eta_mins: >-
          {{ ((as_timestamp(states('sensor.kai_s_tesla_arrival_time')) - as_timestamp(now())) / 60) | int }}
    - repeat:
        count: 3
        sequence:
          - service: notify.mobile_app_pixel_9_pro_fold
            data:
              title: "Tesla Arriving Soon!"
              message: "Tesla arrives home in {{ eta_mins }} minute{{ 's' if eta_mins != 1 else '' }}!"
              data:
                ttl: 0
                priority: high
                channel: alarm_stream
                tag: tesla_arriving
          - delay:
              milliseconds: 800
  mode: single

