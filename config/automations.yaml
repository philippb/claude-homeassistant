- id: 'face_unlock_front_gate'
  alias: Face Unlock Front Gate
  description: >
    Trusted faces auto-unlock. Guests with fewer samples get a notify-only
    alert with an actionable Unlock button.
  triggers:
    - trigger: mqtt
      topic: frigate/events
  conditions:
    - condition: state
      entity_id: lock.door_c8ba
      state: locked
    - condition: template
      value_template: >
        {% set data = trigger.payload_json %}
        {% set sub = data.after.sub_label %}
        {% set name = (sub if sub is string else sub | first) | lower %}
        {% set trusted = ['kai', 'sherry'] %}
        {% set guests  = ['stacy'] %}
        {{ data.type == 'update'
           and data.after.camera == 'reolink_front_gate'
           and data.after.label == 'person'
           and sub is defined
           and sub | length > 0
           and name in trusted + guests }}
  actions:
    - variables:
        recognized_name: >
          {% set sub = trigger.payload_json.after.sub_label %}
          {{ (sub if sub is string else sub | first) | title }}
        is_trusted: >
          {% set sub = trigger.payload_json.after.sub_label %}
          {% set name = (sub if sub is string else sub | first) | lower %}
          {{ name in ['kai', 'sherry'] }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_trusted }}"
          sequence:
            - service: select.select_option
              target:
                entity_id: select.front_gate_doorbell_play_quick_reply_message
              data:
                option: "welcome access grant"
            - service: lock.unlock
              target:
                entity_id: lock.door_c8ba
            - service: notify.mobile_app_pixel_9_pro_fold
              data:
                title: "Front Gate Unlocked"
                message: "{{ recognized_name }} was recognized and unlocked the front gate."
            - service: notify.mobile_app_pixel_fold
              data:
                title: "Front Gate Unlocked"
                message: "{{ recognized_name }} was recognized and unlocked the front gate."
            - service: notify.mobile_app_samsung
              data:
                title: "Front Gate Unlocked"
                message: "{{ recognized_name }} was recognized and unlocked the front gate."
            - service: notify.mobile_app_pixel_watch_4
              data:
                title: "Front Gate Unlocked"
                message: "{{ recognized_name }} was recognized and unlocked the front gate."
            - delay:
                seconds: 10
            - service: lock.lock
              target:
                entity_id: lock.door_c8ba
      default:
        - service: notify.mobile_app_pixel_9_pro_fold
          data:
            title: "Guest at Front Gate"
            message: "{{ recognized_name }} was recognized — unlock the gate?"
            data:
              actions:
                - action: "UNLOCK_GATE_GUEST"
                  title: "Unlock"
        - service: notify.mobile_app_pixel_fold
          data:
            title: "Guest at Front Gate"
            message: "{{ recognized_name }} was recognized — unlock the gate?"
            data:
              actions:
                - action: "UNLOCK_GATE_GUEST"
                  title: "Unlock"
        - service: notify.mobile_app_samsung
          data:
            title: "Guest at Front Gate"
            message: "{{ recognized_name }} was recognized — unlock the gate?"
            data:
              actions:
                - action: "UNLOCK_GATE_GUEST"
                  title: "Unlock"
  mode: single

