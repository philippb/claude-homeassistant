- id: ev_enabled_takeover_reconcile
  alias: EV enabled → takeover Zaptec control (reconcile now)
  mode: single
  enabled: false  # DISABLED: superseded by ev_control_effective_master
  triggers:
  - trigger: state
    entity_id: input_boolean.ev_smart_charge_enabled
  actions:
  - variables:
      charging_switch: '{{ is_state(''switch.zag063912_charging'',''on'') }}'
      charger_mode: '{{ states(''sensor.zag063912_charger_mode'') }}'
      charging_active: '{{ charging_switch or charger_mode == ''connected_charging'' }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.ev_smart_charge_enabled
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.ev_should_charge_now_15m
            state: 'on'
          sequence:
          - condition: template
            value_template: '{{ not charging_active }}'
          - action: button.press
            target:
              entity_id: button.zag063912_resume_charging
        default:
        - condition: template
          value_template: '{{ charging_active }}'
        - action: button.press
          target:
            entity_id: button.zag063912_stop_charging
    default:
    - stop: Disabled -> no control
- id: ev_charge_control_15m_rank_v2
  alias: EV charge control (15m rank) v2
  mode: restart
  enabled: false  # DISABLED: superseded by ev_control_effective_master
  triggers:
    - trigger: state
      entity_id: binary_sensor.ev_should_charge_now_15m

    - trigger: state
      entity_id: sensor.zag063912_charger_mode

    - trigger: state
      entity_id: input_boolean.ev_smart_charge_enabled
      to: "on"

    - trigger: homeassistant
      event: start

  conditions:
    - condition: state
      entity_id: input_boolean.ev_smart_charge_enabled
      state: "on"

  actions:
    - variables:
        charging_switch: "{{ is_state('switch.zag063912_charging','on') }}"
        charger_mode: "{{ states('sensor.zag063912_charger_mode') }}"
        # "Actually charging" is best inferred from charger_mode
        charging_active: "{{ charging_switch or charger_mode == 'connected_charging' }}"
        should_now: "{{ is_state('binary_sensor.ev_should_charge_now_15m','on') }}"

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ should_now }}"
          sequence:
            # Start/resume only if not already charging
            - condition: template
              value_template: "{{ not charging_active }}"
            - action: button.press
              target:
                entity_id: button.zag063912_resume_charging

      default:
        # Stop only if currently charging/active
        - condition: template
          value_template: "{{ charging_active }}"
        - action: button.press
          target:
            entity_id: button.zag063912_stop_charging
- id: ev_target_kwh_clamp_to_soc_limit
  alias: EV UI guard → clamp target kWh to SOC limit
  description: Clamp EV target kWh so it cannot exceed remaining capacity (SOC→100%).
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - input_number.ev_target_kwh
    - sensor.smart_battery
    - sensor.ev_headroom_to_max_soc_kwh
  actions:
  - variables:
      target: '{{ states(''input_number.ev_target_kwh'') | float(0) }}'
      limit_s: '{{ states(''sensor.ev_headroom_to_max_soc_kwh'') }}'
      limit: "{% if limit_s in ['unknown','unavailable','none',''] %}\n  -1\n{% else
        %}\n  {{ limit_s | float(-1) }}\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ limit >= 0 and target > limit }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_target_kwh
        data:
          value: '{# round DOWN to step 0.5 kWh (input_number step=0.5) #} {% set
            step = 0.5 %} {% set v = (limit / step) | round(0, ''floor'') * step %}
            {{ [v, 0] | max | round(2) }}'
- id: ev_deadline_guard_no_past
  alias: EV UI guard → prevent past deadline
  mode: single
  triggers:
  - trigger: state
    entity_id: input_datetime.ev_deadline
  actions:
  - variables:
      dl_s: '{{ states(''input_datetime.ev_deadline'') }}'
      dl_ts: "{% if dl_s in ['unknown','unavailable','none',''] %}\n  none\n{% else
        %}\n  {{ as_timestamp(as_datetime(dl_s)) }}\n{% endif %}"
      now_ts: '{{ as_timestamp(now()) }}'
      min_ok_ts: '{{ now_ts + 15*60 }}'
      next_q_ts: '{# round up to next 15-min boundary #} {% set t = (min_ok_ts | int)
        %} {{ ((t // 900) + 1) * 900 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ dl_ts is not none and dl_ts < min_ok_ts }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_deadline
        data:
          timestamp: '{{ next_q_ts }}'
