- id: watchdog_frigate_crib_camera
  alias: "Watchdog: Restart Frigate if crib camera stalls"
  description: >
    Restarts Frigate when the crib camera FPS is 0. Triggers on frigate/stats MQTT,
    then waits 10 min and confirms FPS is still 0 before restarting. No-op if stream
    recovers within that window. Guard against go2rtc MJPEG→H264 timeout crash loops.
  trigger:
    - platform: mqtt
      topic: "frigate/stats"
  condition:
    - condition: template
      value_template: >
        {% set payload = trigger.payload_json %}
        {% set fps = (payload.cameras.crib.camera_fps
                      if 'cameras' in payload
                      else payload.crib.camera_fps) | float(0) %}
        {{ fps < 0.05 }}
  action:
    - delay: "00:10:00"
    - wait_for_trigger:
        - platform: mqtt
          topic: "frigate/stats"
      timeout: "00:05:00"
      continue_on_timeout: false
    - condition: template
      value_template: >
        {% set payload = wait.trigger.payload_json %}
        {% set fps = (payload.cameras.crib.camera_fps
                      if 'cameras' in payload
                      else payload.crib.camera_fps) | float(0) %}
        {{ fps < 0.05 }}
    - service: hassio.addon_restart
      data:
        addon: ccab4aaf_frigate-fa
    - service: persistent_notification.create
      data:
        title: "Crib Camera Watchdog Triggered"
        message: >
          Restarted Frigate at {{ now().strftime('%Y-%m-%d %H:%M') }} —
          crib camera FPS was 0 for 10+ minutes.
  mode: single
- id: doorbell_front_gate_to_hallway_tv
  alias: Front Gate Doorbell to Hallway TV
  description: >
    When someone rings the front gate doorbell, cast its camera feed to the
    hallway TV for 60 seconds, then stop the cast.
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_gate_doorbell_visitor
      from: 'off'
      to: 'on'
  conditions: []
  actions:
    # Disable Art Mode so it can't relaunch over the cast. While the Reolink
    # stream buffers (~10s+) Art Mode keeps reclaiming the foreground; disabling
    # it removes the race entirely. force-stop clears the running instance.
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_14_205
      data:
        command: pm disable-user --user 0 com.vt.arttv.artmode
    - delay: '00:00:02'
    - action: camera.play_stream
      target:
        entity_id: camera.front_gate_doorbell_fluent
      data:
        media_player: media_player.hallway_tv
        format: hls
    - delay: '00:01:00'
    # Restore Art Mode: re-enable the package, then relaunch it.
    # (adb_command runs one command per call — no ';' chaining.)
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_14_205
      data:
        command: pm enable com.vt.arttv.artmode
    - delay: '00:00:02'
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_14_205
      data:
        command: >-
          am start -n com.vt.arttv.artmode/.ArtModeActivity
          -a com.vt.arttv.artmode.action_main_activity
  mode: restart
